server:
  port: 8084

spring:
  application:
    name: fare-payment-service
  port: 8082

spring:
  application:
    name: driver-vehicle-service
  port: 8083

spring:
  application:
    name: ride-management-service
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:ridelink-shared-super-secret-key-change-me-in-prod-0123456789}

# Fare rule (see FareCalculator):
#   totalFare = max(minimumFare, baseFare + distanceKm x perKmRate + durationMinutes x perMinuteRate)
# durationMinutes defaults to distanceKm / averageSpeedKmh x 60 when not supplied.
fare:
  base-fare: ${FARE_BASE:2.50}
  per-km-rate: ${FARE_PER_KM:1.20}
  per-minute-rate: ${FARE_PER_MINUTE:0.20}
  minimum-fare: ${FARE_MINIMUM:5.00}
  average-speed-kmh: ${FARE_AVG_SPEED_KMH:30}
  currency: ${FARE_CURRENCY:USD}

  # Must match the secret used by account-service - this service only
  # validates tokens, it never issues them.
  secret: ${JWT_SECRET:ridelink-shared-super-secret-key-change-me-in-prod-0123456789}
# Base URL of fare-payment-service, used when a ride completes to trigger fare calculation.
services:
  fare-payment:
    base-url: ${FARE_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ridelink.farepayment: INFO
    com.ridelink.drivervehicle: INFO
    com.ridelink.ridemanagement: INFO

---
# Real MongoDB connection - inactive under the "test" profile so tests
# can fall back to Spring Boot's embedded Mongo auto-configuration,
# which backs off as soon as the connection is explicitly configured.
# Set MONGODB_URI to a full connection string (e.g. an Atlas SRV URI with
# credentials) instead of separate host/port/username/password fields -
# binding an unset username/password to Mongo's char[] password property
# throws a NullPointerException in Spring Boot 3.2.
spring:
  config:
    activate:
      on-profile: '!test'
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ridelink_payments}
      uri: ${MONGODB_URI:mongodb://localhost:27017/ridelink_drivers}
      uri: ${MONGODB_URI:mongodb://localhost:27017/ridelink_rides}
